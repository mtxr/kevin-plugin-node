name: Release

# Conventional Commits merged to main drive release-please: it keeps a release
# PR open with the changelog and the version bump in package.json. Merging that
# PR creates the tag and the GitHub release, then the `publish` job builds the
# module, runs it in a real kevin and uploads it to that release.
#
# Tags created with the default GITHUB_TOKEN do not trigger other workflows, so
# publishing lives in this same workflow instead of a tag-triggered one.
on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the tag and the GitHub release
      pull-requests: write # open and update the release PR
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      # actions are pinned to commit SHAs; the comment names the tag they point to
      - uses: googleapis/release-please-action@5c625bfb5d1ff62eadeeb3772007f7f66fdcf071 # v4
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write # upload the assets to the release
      id-token: write # sign the build provenance
      attestations: write
    env:
      TAG: ${{ needs.release-please.outputs.tag_name }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: lts/*

      - name: The tag matches package.json
        run: |
          want="v$(node -p "require('./package.json').version")"
          [ "$TAG" = "$want" ] || { echo "tag $TAG, but package.json says $want" >&2; exit 1; }

      - run: npm test
      - run: sh scripts/build.sh

      # Never publish a module that kevin cannot run.
      - uses: ./.github/actions/kevin
      - run: KEVIN="$PWD/.kevin/zig-out/bin/kevin" sh scripts/e2e.sh

      # The assets kevin and its users expect: a stable name, and its checksum.
      - name: Checksum
        working-directory: dist
        run: shasum -a 256 node.wasm > node.wasm.sha256

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-path: dist/node.wasm

      - name: Upload to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" dist/node.wasm dist/node.wasm.sha256 --clobber
